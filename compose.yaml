services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flashcard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flashcard}
      POSTGRES_DB: ${POSTGRES_DB:-flashcard}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production build of the Next.js app. For day-to-day development, run only
  # the database (`docker compose up -d db`) and use `npm run dev` on the host.
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flashcard}:${POSTGRES_PASSWORD:-flashcard}@db:5432/${POSTGRES_DB:-flashcard}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
