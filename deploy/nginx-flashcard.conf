# Host nginx reverse proxy for https://flashcard.apaluchdev.com.
# Deploy: sudo cp deploy/nginx-flashcard.conf /etc/nginx/sites-available/flashcard
#         sudo ln -s /etc/nginx/sites-available/flashcard /etc/nginx/sites-enabled/flashcard
#         sudo nginx -t && sudo systemctl reload nginx
#         sudo certbot --nginx -d flashcard.apaluchdev.com
# certbot then adds the `listen 443 ssl` lines and the HTTP -> HTTPS redirect.
server {
    listen 80;
    server_name flashcard.apaluchdev.com;

    # Deck JSON imports are capped at 1 MB by the app.
    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
